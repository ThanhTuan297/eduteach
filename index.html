<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELI10 - Đăng nhập</title>

<!-- Tailwind CSS qua CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font chữ: Baloo 2 cho tiêu đề (nét tròn, dễ thương, hợp trẻ em) + Inter cho phần chữ nội dung -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --green-900:#14532D;
    --green-700:#15803D;
    --green-600:#16A34A;
    --green-500:#22C55E;
    --green-400:#4ADE80;
    --green-100:#DCFCE7;
    --cream:#F6FBF6;
    --skin:#FFD9B3;
    --skin-shadow:#F2C08E;
  }
  body{ font-family:'Inter', sans-serif; background-color: var(--cream); }
  .font-display{ font-family:'Baloo 2', sans-serif; }

  /* ===== Hiệu ứng chuyển động cho nhân vật hoạt họa ===== */
  #mascotSvg .hand-left, #mascotSvg .hand-right{
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1);
    transform-origin: 100px 190px; /* gốc xoay: gần vai nhân vật */
  }
  #mascotSvg .eyes-open, #mascotSvg .eyes-closed, #mascotSvg .eyes-peek{
    transition: opacity 0.2s ease;
  }
  #speechBubble{
    transition: opacity 0.25s ease, transform 0.25s ease;
    transform-origin: bottom left;
  }

  /* Trạng thái mặc định: tay đang buông xuôi hai bên */
  #mascotSvg.state-normal .hand-left{ transform: translate(0,0) rotate(0deg); }
  #mascotSvg.state-normal .hand-right{ transform: translate(0,0) rotate(0deg); }
  #mascotSvg.state-normal .eyes-open{ opacity:1; }
  #mascotSvg.state-normal .eyes-closed{ opacity:0; }
  #mascotSvg.state-normal .eyes-peek{ opacity:0; }

  /* Trạng thái che mắt: hai tay đưa lên che kín mắt khi gõ mật khẩu */
  #mascotSvg.state-covering .hand-left{ transform: translate(28px,-78px) rotate(-18deg); }
  #mascotSvg.state-covering .hand-right{ transform: translate(-28px,-78px) rotate(18deg); }
  #mascotSvg.state-covering .eyes-open{ opacity:0; }
  #mascotSvg.state-covering .eyes-closed{ opacity:1; }
  #mascotSvg.state-covering .eyes-peek{ opacity:0; }

  /* Trạng thái hé nhìn: tay hạ xuống một chút, mắt liếc xuống, xuất hiện bong bóng thoại */
  #mascotSvg.state-peeking .hand-left{ transform: translate(20px,-38px) rotate(-10deg); }
  #mascotSvg.state-peeking .hand-right{ transform: translate(-20px,-38px) rotate(10deg); }
  #mascotSvg.state-peeking .eyes-open{ opacity:0; }
  #mascotSvg.state-peeking .eyes-closed{ opacity:0; }
  #mascotSvg.state-peeking .eyes-peek{ opacity:1; }

  /* Hiệu ứng lắc nhẹ khi đăng nhập thất bại (để dành, có thể dùng sau) */
  @keyframes shake{
    10%,90%{ transform: translateX(-2px); }
    20%,80%{ transform: translateX(4px); }
    30%,50%,70%{ transform: translateX(-8px); }
    40%,60%{ transform: translateX(8px); }
  }
  .animate-shake{ animation: shake 0.5s; }
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 overflow-x-hidden">

  <!-- Khối nền trang trí: vài vòng tròn xanh mờ phía sau cho sinh động -->
  <div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-24 -left-24 w-72 h-72 rounded-full" style="background: var(--green-100);"></div>
    <div class="absolute -bottom-32 -right-16 w-96 h-96 rounded-full" style="background: var(--green-100);"></div>
  </div>

  <div class="w-full max-w-md">

    <!-- ============ NHÂN VẬT HOẠT HỌA (mascot) ============ -->
    <div class="flex justify-center relative" style="margin-bottom:-56px; z-index:20;">
      <svg id="mascotSvg" class="state-normal" width="180" height="200" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">

        <!-- Thân/vai áo màu xanh -->
        <path d="M40 220 Q40 165 100 165 Q160 165 160 220 Z" fill="var(--green-500)"/>

        <!-- Tai -->
        <circle cx="42" cy="118" r="14" fill="var(--skin)"/>
        <circle cx="158" cy="118" r="14" fill="var(--skin)"/>

        <!-- Đầu -->
        <circle cx="100" cy="105" r="70" fill="var(--skin)"/>

        <!-- Tóc (kiểu bờm ngộ nghĩnh) -->
        <path d="M32 95 Q30 30 100 28 Q170 30 168 95 Q150 55 100 55 Q50 55 32 95 Z" fill="var(--green-900)"/>
        <circle cx="100" cy="34" r="10" fill="var(--green-900)"/>

        <!-- Má hồng -->
        <circle cx="62" cy="122" r="9" fill="#FFB3A7" opacity="0.6"/>
        <circle cx="138" cy="122" r="9" fill="#FFB3A7" opacity="0.6"/>

        <!-- ===== Nhóm: Mắt mở bình thường ===== -->
        <g class="eyes-open">
          <circle cx="78" cy="102" r="9" fill="#213547"/>
          <circle cx="122" cy="102" r="9" fill="#213547"/>
          <circle cx="81" cy="99" r="2.5" fill="#fff"/>
          <circle cx="125" cy="99" r="2.5" fill="#fff"/>
        </g>

        <!-- ===== Nhóm: Mắt nhắm tịt (khi che mắt) ===== -->
        <g class="eyes-closed" opacity="0">
          <path d="M69 102 Q78 110 87 102" stroke="#213547" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M113 102 Q122 110 131 102" stroke="#213547" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>

        <!-- ===== Nhóm: Mắt liếc xuống (khi hiện mật khẩu) ===== -->
        <g class="eyes-peek" opacity="0">
          <circle cx="78" cy="104" r="9" fill="#213547"/>
          <circle cx="122" cy="104" r="9" fill="#213547"/>
          <circle cx="79" cy="107" r="2.5" fill="#fff"/>
          <circle cx="123" cy="107" r="2.5" fill="#fff"/>
        </g>

        <!-- Miệng cười tinh nghịch -->
        <path d="M85 130 Q100 140 115 130" stroke="#B65C3F" stroke-width="4" fill="none" stroke-linecap="round"/>

        <!-- ===== Bàn tay trái (che mắt) ===== -->
        <g class="hand-left">
          <ellipse cx="60" cy="188" rx="17" ry="22" fill="var(--skin)"/>
          <ellipse cx="60" cy="188" rx="17" ry="22" fill="none" stroke="var(--skin-shadow)" stroke-width="1.5"/>
        </g>

        <!-- ===== Bàn tay phải (che mắt) ===== -->
        <g class="hand-right">
          <ellipse cx="140" cy="188" rx="17" ry="22" fill="var(--skin)"/>
          <ellipse cx="140" cy="188" rx="17" ry="22" fill="none" stroke="var(--skin-shadow)" stroke-width="1.5"/>
        </g>
      </svg>

      <!-- Bong bóng thoại: hiện dòng mật khẩu lẩm bẩm khi bấm "hiện mật khẩu" -->
      <div id="speechBubble" class="opacity-0 scale-90 absolute -top-2 right-2 bg-white border-2 rounded-2xl rounded-bl-sm px-3 py-1.5 shadow-md" style="border-color: var(--green-400);">
        <p id="speechText" class="text-xs font-semibold whitespace-nowrap" style="color: var(--green-700);">mk: 123...</p>
      </div>
    </div>

    <!-- ============ KHUNG ĐĂNG NHẬP ============ -->
    <div id="loginCard" class="relative bg-white rounded-3xl shadow-xl pt-16 pb-8 px-7 sm:px-9">

      <h1 class="font-display font-bold text-2xl text-center leading-snug" style="color: var(--green-900);">
        ELI10
      </h1>
      <p class="text-center text-sm text-gray-500 mt-1 mb-7">
        Nền tảng thực hành - bản thử nghiệm
      </p>

      <form id="loginForm" class="space-y-4" onsubmit="return false;">

        <!-- Ô Tên đăng nhập -->
        <div>
          <label for="username" class="block text-sm font-medium mb-1.5" style="color: var(--green-900);">Tên đăng nhập</label>
          <input
            type="text" id="username" autocomplete="username"
            placeholder="Nhập tên đăng nhập của bạn"
            class="w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm outline-none transition focus:border-transparent focus:ring-2"
            style="--tw-ring-color: var(--green-400);"
          >
        </div>

        <!-- Ô Mật khẩu -->
        <div>
          <label for="password" class="block text-sm font-medium mb-1.5" style="color: var(--green-900);">Mật khẩu</label>
          <div class="relative">
            <input
              type="password" id="password" autocomplete="current-password"
              placeholder="Nhập mật khẩu của bạn"
              class="w-full rounded-xl border border-gray-200 px-4 py-2.5 pr-11 text-sm outline-none transition focus:border-transparent focus:ring-2"
              style="--tw-ring-color: var(--green-400);"
            >
            <!-- Nút hiện/ẩn mật khẩu -->
            <button
              type="button" id="togglePassword"
              class="absolute right-1 top-1/2 -translate-y-1/2 w-9 h-9 rounded-lg flex items-center justify-center text-lg hover:bg-green-50 transition"
              aria-label="Hiện hoặc ẩn mật khẩu"
            >👁️</button>
          </div>
        </div>

        <!-- Nút Đăng nhập chính -->
        <button
          type="button" id="loginBtn"
          class="w-full rounded-xl py-3 text-white font-semibold text-sm shadow-md transition active:scale-[0.98] hover:brightness-105"
          style="background: linear-gradient(135deg, var(--green-500), var(--green-700));"
        >
          Đăng nhập
        </button>
      </form>

      <!-- Đường kẻ phân cách -->
      <div class="flex items-center gap-3 my-5">
        <div class="h-px flex-1 bg-gray-200"></div>
        <span class="text-xs text-gray-400">hoặc</span>
        <div class="h-px flex-1 bg-gray-200"></div>
      </div>

      <!-- Nút phụ dành cho Dev -->
      <button
        type="button" id="devBypassBtn"
        class="w-full rounded-xl py-2.5 text-sm font-medium border-2 border-dashed transition hover:bg-green-50"
        style="color: var(--green-700); border-color: var(--green-400);"
      >
        ⚡ Vào nhanh (Dev Bypass)
      </button>

      <p class="text-center text-xs text-gray-400 mt-6">
        Chưa có tài khoản? <a href="#" class="font-medium" style="color: var(--green-600);">Đăng ký ngay</a>
      </p>
    </div>
  </div>

<script>
  // ============================================================
  // PHẦN 1: LẤY CÁC PHẦN TỬ DOM CẦN THIẾT
  // ============================================================
  const mascot         = document.getElementById('mascotSvg');
  const usernameInput  = document.getElementById('username');
  const passwordInput  = document.getElementById('password');
  const toggleBtn      = document.getElementById('togglePassword');
  const speechBubble   = document.getElementById('speechBubble');
  const speechText     = document.getElementById('speechText');
  const loginCard      = document.getElementById('loginCard');
  const loginBtn       = document.getElementById('loginBtn');
  const devBypassBtn   = document.getElementById('devBypassBtn');

  let isPasswordVisible = false; // Trạng thái ẩn/hiện mật khẩu hiện tại

  // ============================================================
  // PHẦN 2: HÀM ĐIỀU KHIỂN TRẠNG THÁI NHÂN VẬT HOẠT HỌA
  //   - 'normal'   : mắt mở, tay buông (mặc định / đang gõ username)
  //   - 'covering' : hai tay che kín mắt (đang gõ mật khẩu, ẩn)
  //   - 'peeking'  : tay hạ bớt, mắt liếc xuống + bong bóng thoại (đã bấm hiện mật khẩu)
  // ============================================================
  function setMascotState(state){
    mascot.classList.remove('state-normal', 'state-covering', 'state-peeking');
    mascot.classList.add('state-' + state);

    if (state === 'peeking') {
      showSpeechBubble();
    } else {
      hideSpeechBubble();
    }
  }

  // Hiện bong bóng thoại, lấy vài ký tự đầu của mật khẩu để nhân vật "lẩm bẩm"
  function showSpeechBubble(){
    const value = passwordInput.value;
    if (value.length === 0){
      speechText.textContent = 'ơ... trống trơn?';
    } else {
      // Lấy tối đa 3 ký tự đầu, phần còn lại thay bằng dấu chấm lửng
      const preview = value.slice(0, 3);
      speechText.textContent = 'i can see... ' + preview + (value.length > 3 ? '...' : '');
    }
    speechBubble.classList.remove('opacity-0', 'scale-90');
    speechBubble.classList.add('opacity-100', 'scale-100');
  }

  function hideSpeechBubble(){
    speechBubble.classList.remove('opacity-100', 'scale-100');
    speechBubble.classList.add('opacity-0', 'scale-90');
  }

  // ============================================================
  // PHẦN 3: SỰ KIỆN CHO Ô TÊN ĐĂNG NHẬP
  //   -> Khi người dùng focus vào ô username, đưa nhân vật về trạng thái bình thường
  // ============================================================
  usernameInput.addEventListener('focus', () => {
    if (!isPasswordVisible) setMascotState('normal');
  });

  // ============================================================
  // PHẦN 4: SỰ KIỆN CHO Ô MẬT KHẨU
  //   -> Khi focus hoặc đang gõ mà mật khẩu đang ở chế độ ẨN: nhân vật che mắt lại
  //   -> Nếu đang ở chế độ HIỆN: cập nhật lại lời "lẩm bẩm" theo nội dung mới gõ
  // ============================================================
  passwordInput.addEventListener('focus', () => {
    setMascotState(isPasswordVisible ? 'peeking' : 'covering');
  });

  passwordInput.addEventListener('input', () => {
    setMascotState(isPasswordVisible ? 'peeking' : 'covering');
  });

  // Khi rời khỏi ô mật khẩu mà không gõ gì -> nhân vật trở lại bình thường
  passwordInput.addEventListener('blur', () => {
    if (passwordInput.value.length === 0 && !isPasswordVisible){
      setMascotState('normal');
    }
  });

  // ============================================================
  // PHẦN 5: NÚT 👁️ HIỆN / ẨN MẬT KHẨU
  //   -> Đổi type input giữa "password" và "text"
  //   -> Kích hoạt hiệu ứng hạ tay + liếc mắt + bong bóng thoại
  // ============================================================
  toggleBtn.addEventListener('click', () => {
    isPasswordVisible = !isPasswordVisible;

    if (isPasswordVisible){
      passwordInput.type = 'text';
      toggleBtn.textContent = '🙈';       // đổi icon khi đang hiện mật khẩu
      setMascotState('peeking');
    } else {
      passwordInput.type = 'password';
      toggleBtn.textContent = '👁️';
      // Nếu ô mật khẩu vẫn đang được focus/có nội dung -> tiếp tục che mắt
      setMascotState('covering');
    }

    passwordInput.focus();
  });

  // ============================================================
  // PHẦN 6: NÚT ĐĂNG NHẬP
  //   -> Lưu trạng thái đăng nhập vào localStorage rồi điều hướng sang trangchu.html
  // ============================================================
  loginBtn.addEventListener('click', () => {
    // Kiểm tra đơn giản: yêu cầu nhập đủ cả 2 trường (demo, chưa xác thực thật)
    if (usernameInput.value.trim() === '' || passwordInput.value.trim() === ''){
      loginCard.classList.add('animate-shake');
      setTimeout(() => loginCard.classList.remove('animate-shake'), 500);
      return;
    }

    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('username', usernameInput.value.trim());
    window.location.href = 'trangchu.html';
  });

  // Cho phép nhấn Enter để đăng nhập nhanh
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
  });

  // ============================================================
  // PHẦN 7: NÚT "⚡ VÀO NHANH (DEV BYPASS)"
  //   -> Bỏ qua toàn bộ form, gán trạng thái đăng nhập và chuyển thẳng sang trang chủ
  //   -> Chỉ phục vụ mục đích thử nghiệm (Dev), không dùng cho production thật
  // ============================================================
  devBypassBtn.addEventListener('click', () => {
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('username', 'dev_tester');
    window.location.href = 'trangchu.html';
  });
</script>

</body>
</html>
