<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELI10 - Phòng Học 1-1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col h-screen font-sans">

    <!-- Auth Guard & Initialization Script -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'index.html';
        }
        // Lấy thông tin từ localStorage
        const studentName = localStorage.getItem('selected_student_name') || 'Huy';
        const studentType = localStorage.getItem('selected_student_type') || 'ngo-ngac';
        const lessonTopic = localStorage.getItem('selected_lesson_topic') || 'Cửu chương 2';
        const apiKey = localStorage.getItem('groq_api_key') || '';

        if (!apiKey) {
            alert('Chưa có Groq API Key! Vui lòng quay lại trang Học sinh để cài đặt.');
            window.location.href = 'hocsinh.html';
        }
    </script>

    <!-- Header Phòng Học -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center space-x-4">
            <div class="bg-green-100 text-green-700 font-bold px-3 py-1.5 rounded-lg text-sm">
                ELI10 Phòng Học
            </div>
            <div>
                <h1 id="header-title" class="font-bold text-gray-800 text-lg">Học sinh: Đang tải...</h1>
                <p id="header-topic" class="text-xs text-gray-500">Chủ đề: Đang tải...</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="hoanThanhBaiHoc()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                <i class="fa-solid fa-flag-checkered mr-1.5"></i> Hoàn thành bài học
            </button>
            <a href="hocsinh.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium transition">
                <i class="fa-solid fa-arrow-right-arrow-left mr-1.5"></i> Đổi học sinh
            </a>
        </div>
    </header>

    <!-- Khu vực Khung Chat -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col overflow-hidden">
        <div id="chat-container" class="flex-1 bg-white border border-gray-200 rounded-2xl p-4 overflow-y-auto space-y-4 shadow-inner">
            <!-- Tin nhắn sẽ được thêm tự động bằng JS -->
        </div>

        <!-- Thanh nhập tin nhắn -->
        <div class="mt-4 bg-white border border-gray-200 rounded-2xl p-3 shadow-sm flex items-center space-x-3">
            <input type="text" id="user-input" placeholder="Nhập nội dung bài giảng hoặc câu hỏi CCQ cho học sinh..." 
                class="flex-1 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:border-green-500 text-sm"
                onkeypress="if(event.key === 'Enter') guiTinNhan()">
            <button onclick="guiTinNhan()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-medium text-sm transition flex items-center shadow-sm">
                <span>Gửi bài</span> <i class="fa-solid fa-paper-plane ml-2"></i>
            </button>
        </div>
    </main>

    <!-- Modal Tổng kết bài học -->
    <div id="modal-tong-ket" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
            <div class="text-center">
                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-award"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800">Tổng kết buổi dạy</h3>
                <p class="text-sm text-gray-500">Kết quả tương tác với học sinh</p>
            </div>
            <div class="space-y-2 bg-gray-50 p-4 rounded-xl text-sm">
                <div class="flex justify-between"><span>Học sinh:</span> <span id="modal-hs" class="font-semibold">Huy</span></div>
                <div class="flex justify-between"><span>Chủ đề:</span> <span id="modal-chude" class="font-semibold">Toán</span></div>
                <div class="flex justify-between"><span>Tình trạng bẫy:</span> <span id="modal-bay" class="font-semibold text-green-600">Không sập bẫy</span></div>
                <div class="flex justify-between border-t pt-2 mt-2 font-bold text-base text-green-700">
                    <span>Điểm số đạt được:</span> <span id="modal-diem">85/100</span>
                </div>
            </div>
            <p id="modal-nhanxet" class="text-xs text-gray-600 italic text-center">Giáo viên kiên nhẫn và dùng CCQ xuất sắc!</p>
            <div class="flex space-x-3 pt-2">
                <a href="baocao.html" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-medium text-center transition">
                    Xem báo cáo chi tiết
                </a>
                <a href="trangchu.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-3 rounded-xl font-medium text-center transition">
                    Về trang chủ
                </a>
            </div>
        </div>
    </div>

    <!-- Script xử lý logic phòng học & API -->
    <script>
        let chatHistory = [];
        let trapTriggered = false; // Theo dõi việc sập bẫy "em hiểu rồi"
        let messageCount = 0;

        // Clean Slate & Khởi tạo giao diện
        document.addEventListener("DOMContentLoaded", async () => {
            document.getElementById('header-title').innerText = `Học sinh: ${studentName}`;
            document.getElementById('header-topic').innerText = `Chủ đề: ${lessonTopic}`;
            
            // Xóa lịch sử cũ (Clean Slate)
            chatHistory = [];
            
            // Tạo System Prompt dựa theo tính cách
            let systemPrompt = `Bạn là một học sinh 10 tuổi tên là ${studentName}. Chủ đề bài học hôm nay là: "${lessonTopic}". `;
            if (studentType === 'ngo-ngac') {
                systemPrompt += `Tính cách của bạn: Ngơ ngác, khờ khạo, tiếp thu rất chậm. Bạn không bao giờ hiểu ngay sau 2-3 câu giải thích. Bạn thường trả lời ngây ngô, đôi khi hỏi ngược lại những câu ngớ ngẩn và cần giáo viên kiên nhẫn giảng giải kèm ví dụ đơn giản nhiều lần mới dần hiểu. Thỉnh thoảng hãy nói kiểu "Dạ... em chưa hiểu lắm ạ".`;
            } else if (studentType === 'thong-minh') {
                systemPrompt += `Tính cách của bạn: Thông minh nhưng lười biếng và bướng bỉnh. Bạn rất nhanh hiểu nhưng hay lơ đễnh, thích giả vờ không hiểu hoặc nói "Dạ em hiểu rồi ạ!" cho nhanh để được nghỉ hoặc chơi, dù thực chất có thể bạn chưa nắm chắc. Bạn thích thử thách giáo viên.`;
            } else {
                systemPrompt += `Tính cách của bạn: Quậy phá (Hard Mode). Bạn cực kỳ nghịch ngợm, chê bài học chán ngắt, thích đòi chơi game Roblox hoặc đòi về sớm. Bạn cãi bướng và bắt giáo viên phải dùng ví dụ quậy phá hoặc trò chơi thì mới chịu hợp tác học tập.`;
            }

            // Thêm prompt hệ thống vào mảng chat đầu tiên
            chatHistory.push({ role: "system", content: systemPrompt });

            // Tin nhắn mở đầu từ AI
            addMessage("ai", `Dạ chào thầy/cô! Em là ${studentName}. Hôm nay tụi mình học bài "${lessonTopic}" phải không ạ?`);
            
            // Gọi AI tạo câu chào riêng theo tính cách
            await goiAPIKichHoat(systemPrompt);
        });

        async function goiAPIKichHoat(sysPrompt) {
            const container = document.getElementById('chat-container');
            const loadingId = hienThiLoading();

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: sysPrompt },
                            { role: "user", content: `Hãy bắt đầu buổi học với chủ đề "${lessonTopic}" bằng một câu nói ngắn gọn đúng tính cách của bạn.` }
                        ],
                        temperature: 0.7,
                        max_tokens: 150
                    })
                });

                const data = await response.json();
                xoaLoading(loadingId);

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    addMessage("ai", reply);
                    chatHistory.push({ role: "assistant", content: reply });
                }
            } catch (error) {
                xoaLoading(loadingId);
                console.error("Lỗi API:", error);
                addMessage("ai", `(Hệ thống mạng hơi chậm, nhưng em vẫn sẵn sàng học bài ${lessonTopic} ạ!)`);
            }
        }

        async function guiTinNhan() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage("user", text);
            input.value = "";
            messageCount++;

            chatHistory.push({ role: "user", content: text });

            const loadingId = hienThiLoading();

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: chatHistory,
                        temperature: 0.7,
                        max_tokens: 200
                    })
                });

                const data = await response.json();
                xoaLoading(loadingId);

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    addMessage("ai", reply);
                    chatHistory.push({ role: "assistant", content: reply });

                    // Kiểm tra bẫy "em hiểu rồi"
                    if (reply.toLowerCase().includes("hiểu rồi") || reply.toLowerCase().includes("dạ hiểu")) {
                        trapTriggered = true;
                    }
                }
            } catch (error) {
                xoaLoading(loadingId);
                addMessage("ai", "Dạ mạng bị lỗi rồi thầy/cô ơi...");
            }
        }

        function addMessage(sender, text) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} mb-3`;

            const bubble = document.createElement('div');
            bubble.className = `max-w-md rounded-2xl px-4 py-3 text-sm shadow-sm ${
                sender === 'user' 
                    ? 'bg-green-600 text-white rounded-br-none' 
                    : 'bg-gray-100 text-gray-800 rounded-bl-none border border-gray-200'
            }`;
            bubble.innerText = text;

            div.appendChild(bubble);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function hienThiLoading() {
            const container = document.getElementById('chat-container');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex justify-start mb-3";
            div.innerHTML = `<div class="bg-gray-100 text-gray-500 rounded-2xl px-4 py-3 text-sm italic border border-gray-200">Bé đang suy nghĩ... 💭</div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function xoaLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // Hoàn thành bài học & Chấm điểm -> Lưu vào localStorage cho baocao.html
        function hoanThanhBaiHoc() {
            let score = 85;
            let trapStatusText = "Không sập bẫy (Dùng CCQ tốt)";
            let remark = "Giáo viên kiên nhẫn và kiểm tra kiến thức rất xuất sắc!";

            if (trapTriggered) {
                score = 55;
                trapStatusText = "Đã sập bẫy 'Em hiểu rồi'";
                remark = "Bạn đã quá tin tưởng học sinh mà không dùng câu hỏi CCQ kiểm tra lại!";
            }

            // Hiển thị Modal
            document.getElementById('modal-hs').innerText = studentName;
            document.getElementById('modal-chude').innerText = lessonTopic;
            document.getElementById('modal-bay').innerText = trapStatusText;
            document.getElementById('modal-bay').className = `font-semibold ${trapTriggered ? 'text-red-500' : 'text-green-600'}`;
            document.getElementById('modal-diem').innerText = `${score}/100đ`;
            document.getElementById('modal-nhanxet').innerText = remark;
            document.getElementById('modal-tong-ket').classList.remove('hidden');

            // Lưu lịch sử vào localStorage để trang baocao.html đọc
            let historyList = JSON.parse(localStorage.getItem('eli10_report_history') || '[]');
            historyList.unshift({
                time: new Date().toLocaleDateString('vi-VN'),
                student: studentName,
                topic: lessonTopic,
                score: score,
                remark: remark
            });
            localStorage.setItem('eli10_report_history', JSON.stringify(historyList));

            // Cập nhật kỷ lục điểm cao nhất & tổng số bài
            let maxScore = parseInt(localStorage.getItem('eli10_max_score') || '0');
            if (score > maxScore) {
                localStorage.setItem('eli10_max_score', score);
            }
            let totalLessons = parseInt(localStorage.getItem('eli10_total_lessons') || '0');
            localStorage.setItem('eli10_total_lessons', totalLessons + 1);
        }
    </script>
</body>
</html>
